name: kopdar_driver
description: KopDar - Koperasi Digital untuk Gig Worker Indonesia (Driver App)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.0.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.0
  pin_code_fields: ^8.0.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  share_plus: ^7.2.0
  path_provider: ^2.1.0
  file_picker: ^6.1.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
  network_image_mock: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
