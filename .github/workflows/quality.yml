name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Resolve dependencies
        run: go mod tidy

      - name: Vet
        id: vet
        continue-on-error: true
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee vet-report.txt

      - name: Unit and race tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test-report.txt

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/go.sum
            backend/vet-report.txt
            backend/test-report.txt

      - name: Enforce backend result
        if: always()
        run: |
          test "${{ steps.vet.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/kopdar_driver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze-report.txt

      - name: Test
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test-report.txt

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics
          path: |
            frontend/kopdar_driver/pubspec.lock
            frontend/kopdar_driver/analyze-report.txt
            frontend/kopdar_driver/test-report.txt

      - name: Enforce Flutter result
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
